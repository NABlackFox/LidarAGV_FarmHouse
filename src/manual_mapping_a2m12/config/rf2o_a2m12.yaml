CLaserOdometry2DNode:
  ros__parameters:

    # ===== RPLIDAR A2M12 INPUT =====
    laser_scan_topic: /scan

    # ===== ODOM OUTPUT =====
    odom_topic: /odom
    base_frame_id: base_link
    odom_frame_id: odom
    publish_tf: true

    # Start odometry from zero pose.
    # Empty string disables external initial-pose subscription.
    init_pose_from_topic: ""

    # A2M12 measured scan rate: ~13.6 Hz.
    # Run RF2O faster than incoming scan rate so processing
    # does not become the limiting stage.
    freq: 20.0
